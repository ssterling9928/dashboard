# Production compose, copied as-is to /opt/docker/compose/homelab-dashboard/
# with backend.env beside it. The image is built from GitHub, never from a
# local checkout, and pinned by full commit hash: a tag can be moved or
# recreated by anyone who can push, a commit hash can't.
# To deploy a new version: tag and push it, put its full hash
# (`git rev-parse <tag>`) in `context` and its tag in `image`, commit and
# push this file, copy it over, rebuild.
services:
  dashboard:
    build:
      context: https://github.com/ssterling9928/dashboard.git#d16a44cfa9e40d97ca38a3cb07bcfad6a77116a3   # v1.0.4
      args:
        VITE_GRAFANA_URL: https://grafana.home.sterling-dev.com   # optional
    image: homelab-dashboard:v1.0.4   # older versions stay around for rollback
    container_name: homelab-dashboard
    restart: unless-stopped
    env_file: ./backend.env           # secrets live beside this file, not in the repo
    environment:
      PORT: 4000              # the image listens on 4000; overrides backend.env
      TZ: America/Chicago     # log timestamps are shown in local time
    # Lock the container down: read-only filesystem, no Linux capabilities,
    # no setuid. The only writable places are /tmp and the history volume.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - history:/data         # metric history, kept across redeploys and reboots
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No published ports: the dashboard has no login and can start/stop
    # containers, so it's only reachable on "private_titan". Nginx Proxy Manager
    # (also on "private_titan") forwards to http://homelab-dashboard:4000.
    networks:
      - private_titan         # reaches Loki by name and titan-helper at the gateway

volumes:
  history:                    # created by compose as homelab-dashboard_history

networks:
  private_titan:
    external: true
