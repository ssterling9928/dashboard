# Production compose, copied as-is to /opt/docker/compose/homelab-dashboard/
# with backend.env beside it. The image is built from GitHub, never from a
# local checkout, and pinned by full commit hash: a tag can be moved or
# recreated by anyone who can push, a commit hash can't.
# To deploy a new version: tag and push it, put its full hash
# (`git rev-parse <tag>`) in `context` and its tag in `image`, commit and
# push this file, copy it over, rebuild.
services:
  dashboard:
    build:
      context: https://github.com/ssterling9928/dashboard.git#7bbaa9e91fe89665a8a2a152051a4391bb79d2ac   # v1.0.4
      # Site-specific values come from a .env file beside this one (compose
      # reads it automatically), so they stay out of the repo:
      #   VITE_GRAFANA_URL=https://grafana.example.com
      #   VITE_QUICK_LINKS=Grafana|https://grafana.example.com,Portainer|https://portainer.example.com
      args:
        VITE_GRAFANA_URL: ${VITE_GRAFANA_URL:-}
        VITE_QUICK_LINKS: ${VITE_QUICK_LINKS:-}
    image: homelab-dashboard:v1.0.4   # older versions stay around for rollback
    container_name: homelab-dashboard
    restart: unless-stopped
    env_file: ./backend.env           # secrets and TZ live beside this file, not in the repo
    environment:
      PORT: 4000              # the image listens on 4000; overrides backend.env
    # Lock the container down: read-only filesystem, no Linux capabilities,
    # no setuid. The only writable places are /tmp and the history volume.
    read_only: true
    tmpfs:
      - /tmp
    # Runs as 1026:1026 instead of the image's "node" user (1000). Metric
    # history is kept across redeploys and reboots in a folder that must be
    # owned by that same uid, or saving fails:
    #   sudo mkdir -p /opt/docker/data/homelab-dashboard
    #   sudo chown 1026:1026 /opt/docker/data/homelab-dashboard
    user: "1026:1026"
    volumes:
      - /opt/docker/data/homelab-dashboard:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No published ports: the dashboard can start/stop containers, so it's
    # only reachable on "private_titan", through Nginx Proxy Manager (also on
    # "private_titan", and the login) at http://homelab-dashboard:4000.
    networks:
      - private_titan         # reaches Loki by name and titan-helper at the gateway

networks:
  private_titan:
    external: true
