# Production compose, copied as-is to /opt/docker/compose/homelab-dashboard/
# with backend.env beside it. The image is built from GitHub, never from a
# local checkout. To deploy a new version: bump the tag in `context` and
# `image`, commit, push the commit and the tag, copy this file, rebuild.
services:
  dashboard:
    build:
      context: https://github.com/ssterling9928/dashboard.git#v1.0.1
      args:
        VITE_GRAFANA_URL: https://grafana.home.sterling-dev.com   # optional
    image: homelab-dashboard:v1.0.1   # older versions stay around for rollback
    container_name: homelab-dashboard
    restart: unless-stopped
    env_file: ./backend.env           # secrets live beside this file, not in the repo
    environment:
      PORT: 4000              # the image listens on 4000; overrides backend.env
      TZ: America/Chicago     # log timestamps are shown in local time
    # Nothing is written to disk (history is in memory), so lock the
    # container down: read-only filesystem, no Linux capabilities, no setuid.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No published ports: the dashboard has no login and can start/stop
    # containers, so it's only reachable on "private_titan". Nginx Proxy Manager
    # (also on "private_titan") forwards to http://homelab-dashboard:4000.
    networks:
      - private               # reaches Loki by name and titan-helper at the gateway

networks:
  private:
    name: private_titan       # the existing Docker network's real name
    external: true
